permissions:
  contents: read
jobs:
  physical-authenticated-creator-http-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/real_facade_provenance_bridge_court?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated conversation settlement input contract
        run: node scripts/verify-isolated-conversation-settlement-contract.mjs
      - name: Verify isolated fail-closed studio authority seam
        run: node scripts/verify-isolated-studio-conversation-authority.mjs
      - name: Verify isolated Studio server authority adapter
        run: node scripts/verify-isolated-studio-server-authority-adapter.mjs
      - name: Pin frontend source
        run: |
          git init frontend
          git -C frontend fetch --depth=1 https://github.com/IBandbyte/Iband-frontend-first.git 344d98ff0c7e075a7e6530c8871670ad8044d220
          git -C frontend checkout --detach FETCH_HEAD
          test "$(git -C frontend rev-parse HEAD)" = 344d98ff0c7e075a7e6530c8871670ad8044d220
      - name: Verify isolated exact-source Studio lifecycle handoff contract
        run: node scripts/verify-isolated-real-studio-lifecycle-handoff.mjs
      - name: Verify isolated durable browser pending recovery contract
        run: node scripts/verify-isolated-browser-pending-rehydration.mjs
      - name: Verify source-exact original second-film caller migration denies unwitnessed local rebase
        run: node scripts/verify-isolated-original-second-film-source-migration.mjs
      - name: Reconcile original frontend continuity RED against independent server-owned second-film recovery
        run: node scripts/verify-original-continuity-red-server-reconciliation.mjs
      - name: Verify pinned native Studio server-authorised recovery bridge source exact
        run: node scripts/verify-isolated-pinned-native-studio-recovery-bridge.mjs
      - name: Verify source-exact native Studio recovery and fenced application adoption seams
        run: node scripts/verify-isolated-pinned-studio-native-adoption-seams.mjs
      - name: Verify source-pinned Studio continuity migration candidate fails closed
        run: node scripts/verify-isolated-studio-continuity-migration-candidate.mjs
      - name: Verify source-pinned application editable adoption grant and fence contract
        run: node scripts/verify-isolated-application-editable-adoption.mjs
      - name: Verify pinned application recovery adoption remains read-only until authoritative admission
        run: node scripts/verify-isolated-application-recovery-adoption-boundary.mjs
      - name: Verify pinned Studio server-authorised selection adoption contract
        run: node scripts/verify-isolated-studio-server-selection-adoption.mjs
      - name: Verify pinned real Studio handler adoption candidate contract
        run: node scripts/verify-isolated-studio-real-handler-adoption.mjs
      - name: Audit pinned real studio conversation authority gap
        run: node scripts/verify-pinned-studio-conversation-authority-gap.mjs
      - name: Execute pinned real Studio handler characterization
        run: node scripts/verify-pinned-real-studio-handler-behavior.mjs
      - name: Verify pinned real handler with isolated server authority facade
        run: node scripts/verify-pinned-real-handler-server-authority-facade.mjs
      - name: Verify pinned Creator Workspace in-memory authority wiring candidate
        run: node scripts/verify-pinned-creator-workspace-wiring-candidate.mjs
      - name: Verify isolated pinned real React handler migration candidate
        run: node scripts/verify-real-react-handler-migration-candidate.mjs
      - name: Verify pinned second-film application source migration candidate (original RED held)
        run: node scripts/verify-pinned-second-film-application-source-candidate.mjs
      - name: Verify application-owned second-film injected authority boundary
        run: node scripts/verify-isolated-application-owned-second-film-boundary.mjs
      - name: Verify native application-owned conversation denies missing services
        run: node scripts/verify-pinned-application-owned-conversation-missing-services-denial.mjs
      - name: Audit application adoption readiness and independently reproduce original line-71 RED
        run: node scripts/verify-source-anchored-application-adoption-readiness.mjs
      - name: Verify application-owned Studio service composition via authenticated transport
        run: node scripts/verify-isolated-application-owned-studio-service-composition.mjs
      - name: Audit pinned real Studio route and async Clerk token adoption blockers
        run: node scripts/verify-pinned-application-auth-route-adoption-blockers.mjs
      - name: Verify async Clerk-backed Studio session composition and token-rotation denial
        run: node scripts/verify-isolated-application-studio-async-clerk-session-adapter.mjs
      - name: Pin backend dependency
        run: |
          git init backend
          git -C backend fetch --depth=1 https://github.com/IBandbyte/iband-backend-first.git f367cd1964bac89b7ba23f1a662c0df19c3b8d16
          git -C backend checkout --detach FETCH_HEAD
          test "$(git -C backend rev-parse HEAD)" = f367cd1964bac89b7ba23f1a662c0df19c3b8d16
      - name: Install isolated dependencies
        working-directory: backend
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Install isolated Chromium
        working-directory: backend
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Install exact pinned React frontend dependencies
        run: npm install --prefix frontend --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Verify original frontend RED unchanged and restart publication denial
        run: |
          cp scripts/verify-original-frontend-publication-red-control.mjs frontend/scripts/verify-original-frontend-publication-red-control.mjs
          (cd frontend && node scripts/verify-original-frontend-publication-red-control.mjs)
      - name: Mount exact pinned React Creator Workspace in isolated Chromium
        run: node scripts/verify-pinned-react-creator-workspace-mount.mjs
      - name: Verify disposable pinned React conversation wiring candidate in Chromium
        run: node scripts/verify-pinned-react-conversation-candidate.mjs
      - name: Start isolated Mongo replica set
        run: |
          docker run -d --name facade-provenance-rs0 -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec facade-provenance-rs0 mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec facade-provenance-rs0 mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 30); do
            if docker exec facade-provenance-rs0 mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Physical authenticated HTTP commit readback and revocation across independent processes
        working-directory: backend
        run: |
          cp ../scripts/isolated-server-publication-provenance.mjs .
          cp ../scripts/isolated-writable-admission-gate.mjs .
          cp ../scripts/isolated-server-owned-positive-editor.mjs .
          cp ../scripts/isolated-real-facade-server-edit-bridge.mjs .
          cp ../scripts/isolated-frontend-continuation-compatibility.mjs .
          cp ../scripts/verify-frontend-boundary-compatibility-worker.mjs .
          cp ../scripts/verify-frontend-boundary-compatibility-orchestrator.mjs .
          cp ../scripts/isolated-creator-http-transport.mjs .
          cp ../scripts/isolated-browser-creator-http-adapter.mjs .
          cp ../frontend/src/components/studio/mentor/MovieMentorDurableCreatorWriteBoundary.js ./pinned-frontend-durable-creator-boundary.mjs
          cp ../frontend/src/components/studio/CreatorWorkspace.jsx ./pinned-creator-workspace.jsx
          cp ../scripts/verify-isolated-creator-http-worker.mjs .
          cp ../scripts/verify-isolated-creator-http-orchestrator.mjs .
          cp ../scripts/verify-isolated-creator-browser-persistence-worker.mjs .
          cp ../scripts/verify-isolated-creator-browser-persistence-orchestrator.mjs .
          node ./verify-isolated-creator-browser-persistence-orchestrator.mjs
          cp ../scripts/isolated-conversation-settlement-contract.mjs .
          cp ../scripts/verify-isolated-physical-conversation-settlement.mjs .
          node ./verify-isolated-physical-conversation-settlement.mjs
          cp ../scripts/verify-isolated-conversation-sigkill-worker.mjs .
          cp ../scripts/verify-isolated-conversation-sigkill-orchestrator.mjs .
          node ./verify-isolated-conversation-sigkill-orchestrator.mjs
          cp ../scripts/isolated-conversation-http-authority.mjs .
          cp ../scripts/verify-isolated-react-atomic-http-worker.mjs .
          cp ../scripts/verify-isolated-react-atomic-http-orchestrator.mjs .
          node ./verify-isolated-react-atomic-http-orchestrator.mjs
          cp ../scripts/verify-isolated-atomic-react-ui-worker.mjs .
          cp ../scripts/verify-isolated-atomic-react-ui-orchestrator.mjs .
          node ./verify-isolated-atomic-react-ui-orchestrator.mjs
          cp ../scripts/verify-integrated-react-sigkill-server.mjs .
          cp ../scripts/verify-integrated-react-sigkill-browser.mjs .
          cp ../scripts/verify-integrated-react-sigkill-orchestrator.mjs .
          node ./verify-integrated-react-sigkill-orchestrator.mjs
          cp ../scripts/isolated-real-react-handler-migration-candidate.mjs .
          cp ../scripts/verify-migrated-real-handler-physical-worker.mjs .
          cp ../scripts/verify-migrated-real-handler-physical-orchestrator.mjs .
