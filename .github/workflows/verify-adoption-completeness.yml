            assert.equal(after.verdict.allowed,boundary!=="reconstruction",boundary);
            if(boundary==="reconstruction")assert.equal(after.raw,before.raw,boundary);
            else assert.equal(before.raw,"{damaged",boundary);
            assert.equal(JSON.parse(after.raw).conversations[0].creatorMessage,"A moonlit harbour",boundary);
          }
          console.log("GREEN RECOVERY_INTERRUPTION_BOUNDARY_MATRIX");
          `);
          fs.writeFileSync('diagnostic-interruption-boundaries.mjs',s);
          NODE
          node diagnostic-interruption-boundaries.mjs
