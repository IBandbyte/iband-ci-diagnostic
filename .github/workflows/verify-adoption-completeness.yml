            });
            await page.evaluate(async recovered=>{
              const {reconstructMalformedCache}=await import('/src/components/studio/mentor/DiagnosticMalformedCacheRecovery.js');
              const key='diagnostic-process-crash';
              localStorage.setItem(key,'{crashed');
              window.__recoveryBoundary=false;
              const storage={getItem:k=>localStorage.getItem(k),setItem:(k,v)=>{localStorage.setItem(k,v);if(k===key+'.quarantine'){window.__recoveryBoundary=true;throw Error('Stop before primary write');}}};
              await reconstructMalformedCache({projectId:'film-a',recovered,storage,key,locks:navigator.locks});
            },fixture);
            const before=await page.evaluate(()=>({raw:localStorage.getItem('diagnostic-process-crash'),backup:localStorage.getItem('diagnostic-process-crash.quarantine'),journal:localStorage.getItem('diagnostic-process-crash.recovery-journal'),boundary:window.__recoveryBoundary}));
            assert.equal(before.boundary,true);assert.equal(before.raw,'{crashed');assert.equal(before.backup,before.raw);assert.ok(before.journal);
            await new Promise(r=>setTimeout(r,1500));
            const originalPid=child.pid;
            await kill();
            const fresh=await launch();
            assert.notEqual(child.pid,originalPid);
            const next=await fresh.newPage();
            await next.goto('http://127.0.0.1:4189/');
            const after=await next.evaluate(async recovered=>{
              const {reconstructMalformedCache}=await import('/src/components/studio/mentor/DiagnosticMalformedCacheRecovery.js');
              const key='diagnostic-process-crash';
              const rawBefore=localStorage.getItem(key),backup=localStorage.getItem(key+'.quarantine'),journal=localStorage.getItem(key+'.recovery-journal');
              const verdict=await reconstructMalformedCache({projectId:'film-a',recovered,storage:localStorage,key,locks:navigator.locks});
              return {rawBefore,backup,journal,verdict,raw:localStorage.getItem(key)};
            },fixture);
            console.log('PHYSICAL_PROCESS_RECOVERY',JSON.stringify({before,after,originalPid,freshPid:child.pid}));
            assert.equal(after.rawBefore,before.raw);assert.equal(after.backup,before.backup);assert.equal(after.journal,before.journal);assert.equal(after.verdict.allowed,true);assert.equal(JSON.parse(after.raw).conversations[0].creatorMessage,'A moonlit harbour');
            console.log('GREEN CHROMIUM_SIGKILL_PROFILE_RECOVERY');
          }finally{if(child)await kill();await vite.close();await rm(profile,{recursive:true,force:true});}
