          const profile=await mkdtemp(join(tmpdir(),'mentor-crash-'));
          const vite=await createServer({server:{host:'127.0.0.1',port:4189,strictPort:true}});
          let child,browser;
          async function launch(){
            child=spawn(chromium.executablePath(),['--headless','--no-sandbox','--disable-dev-shm-usage','--remote-debugging-port=19229','--user-data-dir='+profile,'about:blank'],{stdio:'ignore',detached:true});
            for(let i=0;i<100;i++){
              try{const response=await fetch('http://127.0.0.1:19229/json/version');if(response.ok){browser=await chromium.connectOverCDP('http://127.0.0.1:19229');return browser.contexts()[0];}}catch{}
              await new Promise(r=>setTimeout(r,100));
            }
            throw Error('Chromium CDP unavailable');
          }
          async function kill(){
            const exited=once(child,'exit');
            process.kill(-child.pid,'SIGKILL');
            const [code,signal]=await exited;
            assert.equal(signal,'SIGKILL');
            console.log('CHROMIUM_TERMINATED',JSON.stringify({pid:child.pid,code,signal}));
            child=null;browser=null;
          }
