name: Verify isolated editable adoption completeness
on:
  push:
    paths:
      - '.github/workflows/verify-adoption-completeness.yml'
permissions: {}
jobs:
  adoption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch pinned frontend
        run: |
          git init frontend
          git -C frontend fetch --depth=1 https://github.com/IBandbyte/Iband-frontend-first.git a1996da41989fd3a1d5ccc99f4d425c468a292f8
          git -C frontend checkout --detach FETCH_HEAD
          test "$(git -C frontend rev-parse HEAD)" = a1996da41989fd3a1d5ccc99f4d425c468a292f8
      - name: Existing adoption controls
        working-directory: frontend
        run: |
          node scripts/verify-movie-mentor-recovery-adoption-transaction.mjs
          node scripts/verify-movie-mentor-recovery-locked-commit.mjs
      - name: Physical browser adoption completeness
        working-directory: frontend
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          cat > diagnostic-adoption.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          import {createServer} from 'vite';
          const vite=await createServer({server:{host:'127.0.0.1',port:4189,strictPort:true}});
          let browser;
          try{
            await vite.listen();
            browser=await chromium.launch();
            const page=await browser.newPage();
            await page.goto('http://127.0.0.1:4189/');
            const result=await page.evaluate(async()=>{
              const {commitMovieMentorRecoveryWithLock}=await import('/src/components/studio/mentor/MovieMentorRecoveryLockedCommit.js');
              const {projectRecoveredCreatorWorkspace}=await import('/src/components/studio/mentor/MovieMentorRecoveredWorkspaceProjection.js');
              const projectId='film-a',journey={projectId,currentStageId:'story',currentTaskId:'outline'};
              const recovered=projectRecoveredCreatorWorkspace({projectId,state:{projectId,revision:9,creatorStateGeneration:9,projectJourney:journey,memoryContext:{conversations:[{projectId,role:'creator',content:'A moonlit harbour'}]},creatorConfirmedContext:[{key:'project',value:{id:projectId,creatorType:'video',metadata:{creatorMode:'ai-movie'}}}]}});
              const key='diagnostic-adoption-only';
              localStorage.setItem(key,JSON.stringify({projects:[],conversations:[],journey:{}}));
              const read=()=>JSON.parse(localStorage.getItem(key));
              let commits=0;
              const commit=state=>{commits++;localStorage.setItem(key,JSON.stringify(state));};
              const denied=await commitMovieMentorRecoveryWithLock({projectId,recovered,readLocalState:read,commit,locks:navigator.locks,beforeCommit:()=>{const s=read();s.conversations.push({projectId,content:'new local work'});localStorage.setItem(key,JSON.stringify(s));}});
              const preserved=read();
              localStorage.setItem(key,JSON.stringify({projects:[],conversations:[],journey:{}}));
              const allowed=await commitMovieMentorRecoveryWithLock({projectId,recovered,readLocalState:read,commit,locks:navigator.locks});
              return {denied,preserved,allowed,commits,state:read(),expected:recovered.conversationMessages};
            });
            assert.equal(result.denied.allowed,false);
            assert.equal(result.preserved.conversations[0].content,'new local work');
            assert.equal(result.allowed.allowed,true);
            assert.equal(result.commits,1);
            assert.equal(result.state.projects[0].metadata.projectJourney.currentStageId,'story');
            assert.equal(result.state.journey.activeProjectId,'film-a');
            console.log('GREEN adoption lock and local work preservation controls');
            assert.deepEqual(result.state.conversations,result.expected,'Recovered conversation must survive adoption');
            console.log('GREEN ADOPTION_CONVERSATION_COMPLETENESS');
          }finally{if(browser)await browser.close();await vite.close();}
          NODE
          node diagnostic-adoption.mjs
      - name: Isolated candidate conversation preservation repair
        if: failure()
        working-directory: frontend
        run: |
          test -f diagnostic-adoption.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='src/components/studio/mentor/MovieMentorRecoveryLockedCommit.js';
          const source=fs.readFileSync(path,'utf8');
          const anchor='   next.projects=[clone(recovered.project)];';
          if(source.split(anchor).length!==2)throw Error('Unexpected repair anchor');
          fs.writeFileSync(path,source.replace(anchor,anchor+'\n   if(Array.isArray(recovered.conversationMessages)) next.conversations=clone(recovered.conversationMessages);'));
          NODE
          node scripts/verify-movie-mentor-recovery-adoption-transaction.mjs
          node scripts/verify-movie-mentor-recovery-locked-commit.mjs
          node diagnostic-adoption.mjs
      - name: Actual fresh identity runtime resume compatibility
        if: failure()
        working-directory: frontend
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='diagnostic-adoption.mjs';
          const source=fs.readFileSync(path,'utf8');
          const anchor='return {denied,preserved,allowed,commits,state:read(),expected:recovered.conversationMessages};';
          if(source.split(anchor).length!==2)throw Error('Unexpected resume examination anchor');
          fs.writeFileSync('diagnostic-resume.mjs',source.replace(anchor,`              const {default:createMemory}=await import('/src/components/studio/mentor/CreatorMemory.js');
                        const {default:createRuntime}=await import('/src/components/studio/mentor/MovieMentorStudioIdentityRuntime.js');
                        const memory=createMemory({storageKey:key,requireSharedWriteAuthority:true});
                        const runtime=createRuntime({memory});
                        const resume=runtime.getResumeSnapshot();
                        return {denied,preserved,allowed,commits,state:read(),expected:recovered.conversationMessages,resume};`).replace("    console.log('GREEN ADOPTION_CONVERSATION_COMPLETENESS');","    console.log('GREEN ADOPTION_CONVERSATION_COMPLETENESS');"));
          fs.appendFileSync('diagnostic-resume.mjs','');
          const updated=fs.readFileSync('diagnostic-resume.mjs','utf8');
          const assertion="console.log('GREEN ADOPTION_CONVERSATION_COMPLETENESS');";
          if(updated.split(assertion).length!==2)throw Error('Unexpected resume assertion anchor');
          fs.writeFileSync('diagnostic-resume.mjs',updated.replace(assertion,assertion+'\n  assert.equal(result.resume?.projectId,"film-a");\n  assert.equal(result.resume?.projectJourney?.currentStageId,"story");\n  assert.deepEqual(result.resume?.conversationMessages?.map(m=>({role:m.role,text:m.text})),[{role:"creator",text:"A moonlit harbour"}],"Fresh identity runtime must recover the original conversation");\n  console.log("GREEN FRESH_IDENTITY_RESUME");'));
          NODE
          node diagnostic-resume.mjs
      - name: Isolated canonical conversation conversion candidate
        if: failure()
        working-directory: frontend
        run: |
          test -f diagnostic-resume.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='src/components/studio/mentor/MovieMentorRecoveryLockedCommit.js';
          const source=fs.readFileSync(path,'utf8');
          const anchor='if(Array.isArray(recovered.conversationMessages)) next.conversations=clone(recovered.conversationMessages);';
          if(source.split(anchor).length!==2)throw Error('Unexpected conversion anchor');
          fs.writeFileSync(path,source.replace(anchor,`if(Array.isArray(recovered.conversationMessages)){
             const records=recovered.conversationMessages;
             if(records.some(m=>!m||m.projectId!==projectId||!["creator","mentor"].includes(m.role)||typeof m.content!=="string"||!m.content.trim()))return deny("invalid-recovered-conversation");
             next.conversations=records.map((m,i)=>({
               id: "recovered-"+projectId+"-"+recovered.revision+"-"+i,
               type:"conversation", lifecycleStatus:"active", summary:"",
               creatorMessage:m.role==="creator"?m.content:"",
               mentorResponse:m.role==="mentor"?m.content:"",
               relatedProjectIds:[projectId], relatedIdeaIds:[], strategies:[], memorableMoments:[],
               metadata:{projectId,recoveredRevision:recovered.revision},
               createdAt:new Date(i).toISOString(),updatedAt:new Date(i).toISOString()
             }));
           }`));
          const src=fs.readFileSync('diagnostic-resume.mjs','utf8');
          const check="assert.deepEqual(result.state.conversations,result.expected,'Recovered conversation must survive adoption');";
          if(src.split(check).length!==2)throw Error('Unexpected storage assertion anchor');
          fs.writeFileSync('diagnostic-conversion.mjs',src.replace(check,`assert.deepEqual(result.state.conversations.map(m=>({projectId:m.metadata.projectId,role:m.creatorMessage?"creator":"mentor",content:m.creatorMessage||m.mentorResponse})),result.expected,'Recovered conversation semantics must survive conversion');`));
          NODE
          node scripts/verify-movie-mentor-recovery-adoption-transaction.mjs
          node scripts/verify-movie-mentor-recovery-locked-commit.mjs
          node diagnostic-conversion.mjs
      - name: Multiple speakers and invalid adoption controls
        if: failure()
        working-directory: frontend
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let s=fs.readFileSync('diagnostic-conversion.mjs','utf8');
          const fixture="{projectId,role:'creator',content:'A moonlit harbour'}";
          if(s.split(fixture).length!==2)throw Error('Unexpected fixture anchor');
          s=s.replace(fixture,fixture+",{projectId,role:'mentor',content:'Start with the lighthouse'},{projectId,role:'creator',content:'Add a storm'}");
          const expected='[{role:"creator",text:"A moonlit harbour"}]';
          if(s.split(expected).length!==2)throw Error('Unexpected expectation anchor');
          s=s.replace(expected,'[{role:"creator",text:"A moonlit harbour"},{role:"mentor",text:"Start with the lighthouse"},{role:"creator",text:"Add a storm"}]');
          const anchor='const allowed=await commitMovieMentorRecoveryWithLock(';
          if(s.split(anchor).length!==2)throw Error('Unexpected negative control anchor');
          s=s.replace(anchor,`for(const bad of [{projectId:"foreign",role:"creator",content:"foreign"},{projectId,role:"unknown",content:"bad"},{projectId,role:"creator",content:" "}]) {
            const before=JSON.stringify(read());
            const rejected=await commitMovieMentorRecoveryWithLock({projectId,recovered:{...recovered,conversationMessages:[...recovered.conversationMessages,bad]},readLocalState:read,commit,locks:navigator.locks});
            if(rejected.allowed!==false||JSON.stringify(read())!==before||commits!==0)throw Error("Invalid adoption was not denied atomically");
          }
          `+anchor);
          fs.writeFileSync('diagnostic-multiple.mjs',s);
          NODE
          node diagnostic-multiple.mjs
      - name: Physical reload persistence and stable reconstructed identity
        if: failure()
        working-directory: frontend
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=fs.readFileSync('diagnostic-multiple.mjs','utf8');
          const anchor="console.log('GREEN ADOPTION_CONVERSATION_COMPLETENESS');";
          if(s.split(anchor).length!==2)throw Error('Unexpected reload anchor');
          fs.writeFileSync('diagnostic-reload.mjs',s.replace(anchor,anchor+`
            await page.reload();
            const after=await page.evaluate(async()=>{
              const {default:createMemory}=await import('/src/components/studio/mentor/CreatorMemory.js');
              const {default:createRuntime}=await import('/src/components/studio/mentor/MovieMentorStudioIdentityRuntime.js');
              const key='diagnostic-adoption-only';
              const memory=createMemory({storageKey:key,requireSharedWriteAuthority:true});
              return {state:JSON.parse(localStorage.getItem(key)),resume:createRuntime({memory}).getResumeSnapshot()};
            });
            assert.deepEqual(after.state,result.state,'Reload must not mutate stored state');
            assert.equal(after.resume.projectId,result.resume.projectId);
            assert.deepEqual(after.resume.projectJourney,result.resume.projectJourney);
            assert.deepEqual(after.resume.conversationMessages,result.resume.conversationMessages,'Reload must preserve reconstructed message identity and content');
            console.log("GREEN PHYSICAL_RELOAD_STABLE_CONVERSATION");
          `));
          NODE
          node diagnostic-reload.mjs
      - name: Canonical producer projection and adoption compatibility
        if: failure()
        working-directory: frontend
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let s=fs.readFileSync('diagnostic-reload.mjs','utf8');
          const fixture="memoryContext:{conversations:[{projectId,role:'creator',content:'A moonlit harbour'},{projectId,role:'mentor',content:'Start with the lighthouse'},{projectId,role:'creator',content:'Add a storm'}]}";
          if(s.split(fixture).length!==2)throw Error('Unexpected producer fixture anchor');
          const anchor="const recovered=projectRecoveredCreatorWorkspace(";
          if(s.split(anchor).length!==2)throw Error('Unexpected producer import anchor');
          s=s.replace(anchor,`const {projectMemoryContext}=await import('/src/components/studio/mentor/MovieMentorDurableStateSync.js');
            const canonical={id:"historical-conversation-1",type:"conversation",lifecycleStatus:"active",creatorMessage:"A moonlit harbour",mentorResponse:"Start with the lighthouse",relatedProjectIds:[projectId],metadata:{projectId,creatorTurnId:"original-turn-1"},createdAt:"2026-10-01T12:00:00.000Z",updatedAt:"2026-10-01T12:00:05.000Z"};
            const projected=projectMemoryContext({conversations:[canonical]},projectId);
            if(JSON.stringify(projected.conversations)!==JSON.stringify([canonical]))throw Error("Canonical producer lost historical fields");
            const recovered=projectRecoveredCreatorWorkspace(`);
          s=s.replace(fixture,"memoryContext:projected");
          fs.writeFileSync('diagnostic-canonical-producer.mjs',s);
          NODE
          node diagnostic-canonical-producer.mjs
