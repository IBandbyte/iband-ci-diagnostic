name: Isolated Real Facade Writable Bypass Denial
on:
  push:
    branches: [verify/frontend-mongo-authority-integration-01]
    paths:
      - 'scripts/verify-real-facade-writable-bypass-denial.mjs'
      - 'scripts/isolated-real-facade-fenced-admission-inspection.mjs'
      - '.github/workflows/isolated-real-facade-writable-bypass-denial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-facade-writable-bypass-denial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin exact frontend source
        run: |
          git init frontend
          git -C frontend fetch --depth=1 https://github.com/IBandbyte/Iband-frontend-first.git 344d98ff0c7e075a7e6530c8871670ad8044d220
          git -C frontend checkout --detach FETCH_HEAD
          test "$(git -C frontend rev-parse HEAD)" = 344d98ff0c7e075a7e6530c8871670ad8044d220
      - name: Verify strict facade denies grant-to-local publication witness
        run: node scripts/verify-real-facade-writable-bypass-denial.mjs
