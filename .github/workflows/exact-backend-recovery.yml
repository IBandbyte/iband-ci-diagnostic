  pinned-frontend-recovery-adoption:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Fetch and prove pinned isolated frontend candidate
        run: |
          git init candidate
          git -C candidate remote add origin https://github.com/IBandbyte/Iband-frontend-first.git
          git -C candidate fetch --depth=1 origin 03e678856f60a5ddb2b60b3e17d82ae31aa1a801
          git -C candidate checkout --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "03e678856f60a5ddb2b60b3e17d82ae31aa1a801"
          git -C candidate remote remove origin
          echo "PINNED_FRONTEND_CANDIDATE_SHA=03e678856f60a5ddb2b60b3e17d82ae31aa1a801"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent adoption and denial verification on pinned candidate
        working-directory: candidate
        run: node scripts/verify-isolated-recovery-adoption.mjs
      - name: Install pinned frontend candidate dependencies
        working-directory: candidate
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Build pinned frontend candidate
        working-directory: candidate
        run: npm run build
      - name: Creator-facing regression on pinned candidate
        working-directory: candidate
        run: npm run verify:movie-mentor-creator-facing
      - name: Studio cockpit regression on pinned candidate
        working-directory: candidate
        run: npm run verify:movie-mentor-studio-cockpit
      - name: Diagnose unchanged conversation continuity rejection without weakening assertion
        working-directory: candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/verify-movie-mentor-conversation-continuity.mjs')
          s=p.read_text()
          anchor='assert.equal(cleared.acquired, true);'
          assert s.count(anchor)==1
          s=s.replace(anchor,'console.log("DIAGNOSTIC_SHARED_AUTHORITY_REJECTION", JSON.stringify(cleared));\n'+anchor)
          p.write_text(s)
          PY
      - name: Compare conversation continuity against original pinned frontend baseline
        continue-on-error: true
        run: |
          git init baseline
          git -C baseline remote add origin https://github.com/IBandbyte/Iband-frontend-first.git
          git -C baseline fetch --depth=1 origin a1996da41989fd3a1d5ccc99f4d425c468a292f8
          git -C baseline checkout --detach FETCH_HEAD
          test "$(git -C baseline rev-parse HEAD)" = "a1996da41989fd3a1d5ccc99f4d425c468a292f8"
          echo "ORIGINAL_FRONTEND_BASELINE_SHA=$(git -C baseline rev-parse HEAD)"
          cd baseline
          node scripts/verify-movie-mentor-conversation-continuity.mjs
      - name: Independent positive read-only conversation restoration and provenance denial court
        working-directory: candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/verify-movie-mentor-conversation-continuity.mjs')
          s=p.read_text()
          marker='// The Studio ensure operation intentionally resumes an existing active movie.'
          assert s.count(marker)==1, 'Expected unique baseline transition marker'
          prefix=s.split(marker)[0]
          extra='''
          const beforeDeniedWrite = JSON.stringify(memoryB.getState());
          const denied = await memoryB.replaceStateWithSharedAuthority({
            locks,
            transform: state => ({ ...state, journey: { ...(state.journey || {}), activeProjectId: null } }),
          });
          assert.equal(denied.acquired, false, "Fresh facade must not gain unwitnessed publication authority");
          assert.equal(denied.reason, "publication-outbox-provenance-unverified");
          assert.equal(JSON.stringify(memoryB.getState()), beforeDeniedWrite, "Denied operation must not mutate facade");
          const afterDeniedResume = runtimeB.getResumeSnapshot();
          assert.equal(afterDeniedResume.projectId, project.id);
          assert.deepEqual(afterDeniedResume.conversationMessages, resumed.conversationMessages);
          assert.equal(afterDeniedResume.sessionHandoff.projectId, project.id);
          console.log("GREEN READ_ONLY_RESTART_CONVERSATION_AND_HANDOFF_RESTORED");
          console.log("GREEN UNWITNESSED_PUBLICATION_AUTHORITY_DENIED_WITHOUT_MUTATION");
          '''
          Path('scripts/verify-independent-readonly-restoration.mjs').write_text(prefix + extra)
          PY
          node scripts/verify-independent-readonly-restoration.mjs
      - name: Independent recovery adoption durable restart and next-scene court
        working-directory: candidate
        run: |
          cat > scripts/verify-independent-recovery-next-scene.mjs <<'EOF'
          import assert from "node:assert/strict";
          import {commitMovieMentorRecoveryWithLock} from "../src/components/studio/mentor/MovieMentorRecoveryLockedCommit.js";
          import {withMovieMentorMemoryWriteAuthority} from "../src/components/studio/mentor/MovieMentorMemoryWriteAuthority.js";
          const projectId="restart-film";
          const project={id:projectId,title:"Restart film",creatorType:"video",metadata:{creatorMode:"ai-movie"}};
          const recovered={project,revision:3,creatorStateGeneration:3,conversationMessages:[{id:"scene-one",creatorMessage:"First scene"}],sessionHandoffs:[{id:"handoff-one",type:"session-handoff",projectId,content:"Continue film",scope:"project",status:"active"}]};
          const locks={request:async(_name,_options,callback)=>callback({name:"exclusive",mode:"exclusive"})};
          let durable=JSON.stringify({projects:[],conversations:[],sessionHandoffs:[],journey:{activeProjectId:null}});
          let writes=0;
          const read=()=>JSON.parse(durable);
          const commit=async state=>{writes++;durable=JSON.stringify(state)};
          const adopted=await commitMovieMentorRecoveryWithLock({projectId,recovered,readLocalState:read,commit,locks});
          assert.equal(adopted.allowed,true,JSON.stringify(adopted));
          assert.equal(writes,1);
          const restarted=read();
          assert.equal(restarted.projects[0].id,projectId);
          assert.equal(restarted.conversations[0].id,"scene-one");
          assert.equal(restarted.sessionHandoffs[0].id,"handoff-one");
          console.log("GREEN ADOPTION_SURVIVES_SERIALIZED_RESTART");
          const continued=await withMovieMentorMemoryWriteAuthority({locks,operation:async()=>{
            const current=read();
            assert.equal(current.journey.activeProjectId,projectId);
            assert.equal(current.conversations.length,1);
            current.conversations.push({id:"scene-two",creatorMessage:"Next scene"});
            await commit(current);
            return {saved:true};
          }});
          assert.equal(continued.acquired,true);
          assert.equal(continued.value.saved,true);
          assert.equal(writes,2);
          const secondRestart=read();
          assert.deepEqual(secondRestart.conversations.map(m=>m.id),["scene-one","scene-two"]);
          assert.equal(secondRestart.sessionHandoffs[0].id,"handoff-one");
          assert.equal(secondRestart.projects[0].id,projectId);
          console.log("GREEN NEXT_SCENE_LOCKED_WRITE_SURVIVES_SECOND_SERIALIZED_RESTART");
          console.log("SCOPE synthetic storage adapter; NOT strict CreatorMemory publication-outbox authority");
          EOF
          node scripts/verify-independent-recovery-next-scene.mjs
      - name: Real Creator Memory live-writer and restart provenance boundary court
        working-directory: candidate
        run: |
          cat > scripts/verify-real-creator-memory-writer-boundary.mjs <<'EOF'
          import assert from "node:assert/strict";
          import createCreatorMemory,{createMemoryStorageAdapter} from "../src/components/studio/mentor/CreatorMemory.js";
          const storage=createMemoryStorageAdapter();
          const locks={request:async(_name,_options,callback)=>callback({name:"exclusive",mode:"exclusive"})};
          const live=createCreatorMemory({storageAdapter:storage,requireSharedWriteAuthority:true});
          const first=await live.replaceStateWithSharedAuthority({locks,transform:state=>({...state,journey:{...(state.journey||{}),writerCourtStep:1}})});
          assert.equal(first.acquired,true,JSON.stringify(first));
          const second=await live.replaceStateWithSharedAuthority({locks,transform:state=>({...state,journey:{...(state.journey||{}),writerCourtStep:2}})});
          assert.equal(second.acquired,true,JSON.stringify(second));
          assert.equal(live.readPersistedState().journey.writerCourtStep,2);
          console.log("GREEN REAL_CREATOR_MEMORY_LIVE_WITNESSED_SEQUENTIAL_WRITES");
          const restarted=createCreatorMemory({storageAdapter:storage,requireSharedWriteAuthority:true});
          assert.equal(restarted.readPersistedState().journey.writerCourtStep,2);
          const before=JSON.stringify(restarted.readPersistedState());
          const denied=await restarted.replaceStateWithSharedAuthority({locks,transform:state=>({...state,journey:{...(state.journey||{}),writerCourtStep:3}})});
          assert.equal(denied.acquired,false);
          assert.equal(denied.reason,"publication-outbox-provenance-unverified");
          assert.equal(JSON.stringify(restarted.readPersistedState()),before);
          console.log("GREEN REAL_CREATOR_MEMORY_RESTART_DENIAL_PRESERVES_DURABLE_STATE");
          console.log("SCOPE no independent durable restart-writer credential exists; positive restart write remains uncertified");
          EOF
          node scripts/verify-real-creator-memory-writer-boundary.mjs
      - name: Conversation continuity regression on pinned candidate
        working-directory: candidate
        run: npm run verify:movie-mentor-conversation-continuity
