name: Independent Exact Backend Recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/exact-backend-recovery.yml']
  workflow_dispatch:
permissions: {}
jobs:
  physical-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/movie_mentor_same_record_recovery?replicaSet=rs0
      MOVIE_MENTOR_ISOLATED_MONGO_URI: mongodb://127.0.0.1:27017/movie_mentor_same_record_recovery?replicaSet=rs0
      NODE_ENV: test
    steps:
      - name: Fetch exact public backend source without credentials
        run: |
          git init backend
          git -C backend remote add origin https://github.com/IBandbyte/iband-backend-first.git
          git -C backend fetch --depth=1 origin f367cd1964bac89b7ba23f1a662c0df19c3b8d16
          git -C backend checkout --detach FETCH_HEAD
          test "$(git -C backend rev-parse HEAD)" = "f367cd1964bac89b7ba23f1a662c0df19c3b8d16"
          git -C backend remote remove origin
          echo "EXACT_BACKEND_SHA=f367cd1964bac89b7ba23f1a662c0df19c3b8d16"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated test dependencies without writing a lockfile
        working-directory: backend
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Independent synthetic Clerk credential diagnosis
        working-directory: backend
        run: |
          node --input-type=module <<'NODE'
          import {generateKeyPairSync,createSign} from 'node:crypto';
          import {createMovieMentorProductionAuthenticationComposition} from './ai/MovieMentorProductionAuthenticationComposition.js';
          const {privateKey,publicKey}=generateKeyPairSync('rsa',{modulusLength:2048});
          const issuer='https://isolated-clerk.example', audience='movie-mentor-same-record', origin='http://127.0.0.1:7777';
          const auth=createMovieMentorProductionAuthenticationComposition({env:{MOVIE_MENTOR_CLERK_JWT_KEY:publicKey.export({type:'spki',format:'pem'}),MOVIE_MENTOR_CLERK_AUTHORIZED_PARTIES_JSON:JSON.stringify([origin]),MOVIE_MENTOR_CLERK_ISSUER:issuer,MOVIE_MENTOR_AUDIENCE:audience}});
          const now=Math.floor(Date.now()/1000);
          console.log('CLERK_VERSION',JSON.parse((await import('node:fs')).readFileSync('node_modules/@clerk/backend/package.json','utf8')).version);
          const input=Buffer.from(JSON.stringify({alg:'RS256',typ:'JWT'})).toString('base64url')+'.'+Buffer.from(JSON.stringify({iss:issuer,aud:audience,azp:origin,sub:'owner',sid:'isolated-session',iat:now,nbf:now-1,exp:now+300})).toString('base64url');
          const signer=createSign('RSA-SHA256');signer.update(input);signer.end();
          const credential=input+'.'+signer.sign(privateKey).toString('base64url');
          try { const p=await auth.verifyCredential({credential,expectedIssuer:issuer,expectedAudience:audience}); console.log('DIRECT_AUTH_VERIFIED',p.verified===true); }
          catch(e){console.log('DIRECT_AUTH_REJECTED',JSON.stringify({code:e.code,causeName:e.cause?.name,causeReason:e.cause?.reason,causeCode:e.cause?.code,causeMessage:String(e.cause?.message||'').replace(/[A-Za-z0-9_-]{20,}/g,'[redacted]')}));}
          for(const [label,cat,key] of [['session','cl_B7d4PD111AAA',privateKey],['machine','cl_B7d4PD333AAA',privateKey],['forged','cl_B7d4PD111AAA',generateKeyPairSync('rsa',{modulusLength:2048}).privateKey]]) {
            const data=Buffer.from(JSON.stringify({alg:'RS256',typ:'JWT',cat})).toString('base64url')+'.'+input.split('.')[1];
            const s=createSign('RSA-SHA256');s.update(data);s.end();
            let accepted=false;
            try { const p=await auth.verifyCredential({credential:data+'.'+s.sign(key).toString('base64url'),expectedIssuer:issuer,expectedAudience:audience}); accepted=p.verified===true; }
            catch(e){console.log('CATEGORY_REJECTION',label,e.code,e.cause?.reason,String(e.cause?.message||'').replace(/[A-Za-z0-9_-]{20,}/g,'[redacted]'));}
            console.log('CATEGORY_RESULT',label,accepted);
            if(accepted!==(label==='session')) process.exitCode=1;
          }
          const fs=await import('node:fs');
          const sdk=fs.readFileSync('node_modules/@clerk/backend/dist/index.js','utf8');
          for(const line of sdk.split('\n').filter(x=>/JWT_CATEGORY_|function isNonSessionJwtCategory|function isSessionJwtCategory/.test(x))) console.log('SDK_CATEGORY',line.trim().slice(0,500));
          NODE
          grep -R -n -B 22 -A 12 'Invalid session token category' node_modules/@clerk/backend/dist --include='*.js' | cut -c1-500 | head -130 || true
      - name: Start isolated MongoDB with replica-set mode enabled
        run: |
          docker run -d --name movie-mentor-rs0 -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec movie-mentor-rs0 mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then
              echo "Mongo daemon ready"
              exit 0
            fi
            sleep 2
          done
          echo "Mongo daemon failed to start" >&2
          exit 1
      - name: Initialize isolated Mongo replica set
        run: |
          docker exec movie-mentor-rs0 mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 30); do
            if docker exec movie-mentor-rs0 mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then
              echo "Mongo replica-set PRIMARY ready"
              exit 0
            fi
            sleep 2
          done
          echo "Mongo replica-set PRIMARY did not become ready" >&2
          exit 1
      - name: Physical signed HTTP and durable Mongo creator recovery court
        working-directory: backend
        run: node scripts/verify-movie-mentor-same-record-http-mongo-recovery.mjs
      - name: Fetch pinned frontend and examine real HTTP transport
        run: |
          git init frontend
          git -C frontend fetch --depth=1 https://github.com/IBandbyte/Iband-frontend-first.git a1996da41989fd3a1d5ccc99f4d425c468a292f8
          git -C frontend checkout --detach FETCH_HEAD
          test "$(git -C frontend rev-parse HEAD)" = a1996da41989fd3a1d5ccc99f4d425c468a292f8
          cd frontend
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          cd ../backend
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='scripts/verify-movie-mentor-same-record-http-mongo-recovery.mjs';
          const source=fs.readFileSync(path,'utf8');
          const anchor='  const owner=await get(sign("owner"));';
          if(source.split(anchor).length!==2) throw Error('Unexpected examination anchor');
          fs.writeFileSync('scripts/diagnostic-cross-repo-transport.mjs',source.replace('let server;','let server,extendedMemory;').replace('memoryContext:{note:"isolated real transition "+id}', 'memoryContext:{note:"isolated real transition "+id,conversations:[{projectId:project(id),role:"creator",content:"A moonlit harbour"}]},projectJourney:{projectId:project(id),currentStageId:"story",currentTaskId:"outline"},creatorConfirmedContext:[{key:"project",value:{id:project(id),title:"Harbour Film",creatorType:"video",metadata:{creatorMode:"ai-movie"}}}]').replace(anchor,`  const {recoverMovieMentorCreatorState}=await import("../../frontend/src/components/studio/mentor/MovieMentorDurableStateSync.js");
          const realFetch=(path,options)=>{assert.ok(path.startsWith("/api/movie-mentor/state/recovery/"));return fetch("http://127.0.0.1:"+recoveryServer.address().port+path,options);};
          const recover=token=>recoverMovieMentorCreatorState({projectId:saved.projectId,getAuthToken:async()=>token,fetchImpl:realFetch});
          const actual=await recover(sign("owner"));
          assert.equal(actual.projectId,saved.projectId);
          assert.equal(actual.revision,saved.revision);
          assert.equal(actual.creatorStateGeneration,saved.creatorStateGeneration);
          assert.deepEqual(actual.memoryContext,saved.memoryContext);
          await assert.rejects(recover(sign("intruder")),{status:403});
          await assert.rejects(recover(sign("owner",generateKeyPairSync("rsa",{modulusLength:2048}).privateKey)),{status:401});
          console.log("GREEN CROSS_REPO_REAL_HTTP_TRANSPORT");
          const {projectRecoveredCreatorWorkspace}=await import("../../frontend/src/components/studio/mentor/MovieMentorRecoveredWorkspaceProjection.js");
          const view=projectRecoveredCreatorWorkspace({projectId:saved.projectId,state:actual});
          assert.equal(view.project.title,"Harbour Film");
          assert.equal(view.project.id,saved.projectId);
          assert.equal(view.projectJourney.currentStageId,"story");
          assert.equal(view.projectJourney.currentTaskId,"outline");
          assert.equal(view.conversationMessages[0].content,"A moonlit harbour");
          assert.equal(view.revision,saved.revision);
          assert.equal(view.creatorStateGeneration,saved.creatorStateGeneration);
          assert.throws(()=>projectRecoveredCreatorWorkspace({projectId:"other-project",state:actual}),{code:"MOVIE_MENTOR_RECOVERY_PROJECTION_INVALID"});
          console.log("GREEN CROSS_REPO_DURABLE_WORKSPACE_PROJECTION");
          const {runBrowserCourt}=await import("../../frontend/diagnostic-browser-court.mjs");
          extendedMemory=await runBrowserCourt({port:recoveryServer.address().port,projectId:saved.projectId,ownerToken:sign("owner"),intruderToken:sign("intruder")});
          assert.deepEqual(await states.findOne({projectId:saved.projectId}),saved);
          console.log("GREEN CROSS_REPO_BROWSER_READONLY_RECOVERY");
          `+anchor).replace('readAuthoritativeTurnSource:async()=>{const e=Error("No creator state");e.code="MOVIE_MENTOR_CREATOR_STATE_NOT_FOUND";throw e;}','readAuthoritativeTurnSource').replace(' process.stdout.write(output);',` process.stdout.write(output);
          const {projectMemoryContext}=await import("../../frontend/src/components/studio/mentor/MovieMentorDurableStateSync.js");
          const memoryContext=projectMemoryContext(extendedMemory,saved.projectId);
          assert.deepEqual(memoryContext.conversations,extendedMemory.conversations);
          const payload={projectId:saved.projectId,operationId:"connected-continuation-save",source:"creator-memory",expectedRevision:1,state:{memoryContext}};
          const send=async body=>{const r=await fetch(base+"/state/sync",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer isolated-valid"},body:JSON.stringify(body)});return {status:r.status,body:await r.json()};};
          const first=await send(payload);
          console.log("CONNECTED_REVISION_UPDATE",JSON.stringify(first));
          assert.equal(first.status,200);
          const updated=await states.findOne({projectId:saved.projectId});
          assert.equal(updated.revision,2);assert.equal(updated.creatorStateGeneration,2);
          assert.deepEqual(updated.memoryContext.conversations,extendedMemory.conversations);
          assert.equal((await ownerships.findOne({projectId:saved.projectId})).creatorStateFenceEpoch,2);
          const replay=await send(payload);
          assert.equal(replay.status,200);
          assert.deepEqual(replay.body,first.body);
          assert.equal((await ownerships.findOne({projectId:saved.projectId})).creatorStateFenceEpoch,2);
          const stale=await send({...payload,operationId:"connected-stale-overwrite",state:{memoryContext:saved.memoryContext}});
          console.log("CONNECTED_REVISION_REPLAY_STALE",JSON.stringify({replay,stale}));
          assert.equal(stale.status,409);assert.equal(stale.body.code,"MOVIE_MENTOR_CREATOR_STATE_REVISION_CONFLICT");
          assert.deepEqual(await states.findOne({projectId:saved.projectId}),updated);
          assert.equal(await operations.countDocuments({projectId:saved.projectId}),2);
          assert.equal((await ownerships.findOne({projectId:saved.projectId})).creatorStateFenceEpoch,2);
          console.log("GREEN CONNECTED_DURABLE_REVISION_UPDATE_REPLAY");
          const secondApp=express();
          secondApp.use("/api/movie-mentor",createMovieMentorCreatorStateRecoveryExpressRouter({authentication,ownershipAuthority:createMovieMentorProjectOwnershipAuthority(),readCreatorState:readAuthoritativeTurnSource}));
          const secondServer=createServer(secondApp);secondServer.listen(0,"127.0.0.1");await once(secondServer,"listening");
          try{
           const {runRevisionTwoCourt}=await import("../../frontend/diagnostic-browser-court.mjs");
           await runRevisionTwoCourt({port:secondServer.address().port,projectId:saved.projectId,ownerToken:sign("owner"),expected:memoryContext.conversations,expectedHandoff:memoryContext.sessionHandoffs[0]});
           assert.deepEqual(await states.findOne({projectId:saved.projectId}),updated);
           assert.equal(await operations.countDocuments({projectId:saved.projectId}),2);
           assert.equal((await ownerships.findOne({projectId:saved.projectId})).creatorStateFenceEpoch,2);
           console.log("GREEN CONNECTED_REVISION_TWO_FRESH_BROWSER");
          }finally{await new Promise(resolve=>secondServer.close(resolve));}

          `));
          NODE
          cat > ../frontend/diagnostic-browser-court.mjs <<'BROWSER'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          import {createServer} from 'vite';
          import fs from 'node:fs';
          import {spawn} from 'node:child_process';
          import {once} from 'node:events';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';
          import {fileURLToPath} from 'node:url';
          export async function runBrowserCourt({port,projectId,ownerToken,intruderToken}){
            const root=fileURLToPath(new URL('.',import.meta.url));
            fs.writeFileSync(root+'diagnostic-recovery.html','<!doctype html><div id="root"></div><script type="module" src="/diagnostic-recovery.jsx"></script>');
            fs.writeFileSync(root+'diagnostic-recovery.jsx',`import React from 'react';import {createRoot} from 'react-dom/client';import Workspace from './src/components/studio/CreatorWorkspace.jsx';import {setMovieMentorCreatorAuthState} from './src/components/studio/mentor/MovieMentorCreatorAuthenticationTransport.js';setMovieMentorCreatorAuthState({isLoaded:true,isSignedIn:true,getToken:async()=>window.__isolatedToken});createRoot(document.getElementById('root')).render(<Workspace/>);`);
            const vite=await createServer({root,server:{host:'127.0.0.1',port:4188,strictPort:true,proxy:{'/api/movie-mentor':{target:'http://127.0.0.1:'+port}}}});
            let browser;
            try{
              await vite.listen();
              browser=await chromium.launch({headless:true});
              for(const [token,owner] of [[ownerToken,true],[intruderToken,false]]){
                const context=await browser.newContext();
                await context.addInitScript(t=>{window.__isolatedToken=t;window.__initialStorageLength=localStorage.length;},token);
                const page=await context.newPage();
                await page.goto('http://127.0.0.1:4188/diagnostic-recovery.html');
                assert.equal(await page.evaluate(()=>window.__initialStorageLength),0);
                const section=page.getByRole('region',{name:'Recover an existing Movie Mentor project'});
                await section.getByRole('textbox',{name:'Existing movie project ID'}).fill(projectId);
                const pending=page.waitForResponse(r=>r.url().includes('/state/recovery/')&&r.request().method()==='GET');
                await section.getByRole('button',{name:'Recover movie preview'}).click();
                assert.equal((await pending).status(),owner?200:403);
                if(owner){
                  await section.getByRole('heading',{name:'Harbour Film'}).waitFor();
                  await section.getByText('Saved stage: story; task: outline',{exact:false}).waitFor();
                  await section.getByText('A moonlit harbour',{exact:true}).waitFor();
                  await section.getByText('Saved revision: 1. This is a read-only preview; editing is not enabled.',{exact:true}).waitFor();
                }else{
                  await section.getByRole('alert').waitFor();
                  assert.equal(await section.getByRole('heading',{name:'Harbour Film'}).count(),0);
                }
                await context.close();
              }
              const profile=fs.mkdtempSync(join(tmpdir(),'server-recovery-crash-'));
              let child;
              try{
                child=spawn(chromium.executablePath(),['--headless','--no-sandbox','--disable-dev-shm-usage','--remote-debugging-port=19229','--user-data-dir='+profile,'about:blank'],{detached:true,stdio:'ignore'});
                let connected;
                for(let i=0;i<100;i++){try{if((await fetch('http://127.0.0.1:19229/json/version')).ok){connected=await chromium.connectOverCDP('http://127.0.0.1:19229');break;}}catch{}await new Promise(r=>setTimeout(r,100));}
                assert.ok(connected);
                const crashPage=await connected.contexts()[0].newPage();
                await crashPage.goto('http://127.0.0.1:4188/diagnostic-recovery.html');
                await crashPage.evaluate(()=>{localStorage.setItem('diagnostic-crash-cache','{damaged');localStorage.setItem('diagnostic-crash-cache.quarantine','{damaged');localStorage.setItem('diagnostic-crash-cache.recovery-journal','interrupted');});
                const pid=child.pid,exited=once(child,'exit');
                process.kill(-pid,'SIGKILL');
                const [,signal]=await exited;child=null;assert.equal(signal,'SIGKILL');
                console.log('SERVER_RECOVERY_CRASH_CONFIRMED',JSON.stringify({pid,signal}));
                await browser.close();
                browser=await chromium.launch({headless:true});
                const fresh=await browser.newContext();
                await fresh.addInitScript(t=>{window.__isolatedToken=t;window.__initialStorageLength=localStorage.length;},ownerToken);
                const restored=await fresh.newPage();
                await restored.goto('http://127.0.0.1:4188/diagnostic-recovery.html');
                assert.equal(await restored.evaluate(()=>window.__initialStorageLength),0);
                const region=restored.getByRole('region',{name:'Recover an existing Movie Mentor project'});
                await region.getByRole('textbox',{name:'Existing movie project ID'}).fill(projectId);
                const response=restored.waitForResponse(r=>r.url().includes('/state/recovery/')&&r.request().method()==='GET');
                await region.getByRole('button',{name:'Recover movie preview'}).click();
                assert.equal((await response).status(),200);
                await region.getByRole('heading',{name:'Harbour Film'}).waitFor();
                await region.getByText('A moonlit harbour',{exact:true}).waitFor();
                await region.getByText('Saved stage: story; task: outline',{exact:false}).waitFor();
                await region.getByText('Saved revision: 1. This is a read-only preview; editing is not enabled.',{exact:true}).waitFor();
                console.log('GREEN SERVER_AUTHORITATIVE_FRESH_BROWSER_AFTER_SIGKILL');
                const adoption=await restored.evaluate(async pid=>{
                  const {recoverMovieMentorCreatorState}=await import('/src/components/studio/mentor/MovieMentorDurableStateSync.js');
                  const {projectRecoveredCreatorWorkspace}=await import('/src/components/studio/mentor/MovieMentorRecoveredWorkspaceProjection.js');
                  const {commitMovieMentorRecoveryWithLock}=await import('/src/components/studio/mentor/MovieMentorRecoveryLockedCommit.js');
                  const state=await recoverMovieMentorCreatorState({projectId:pid,getAuthToken:async()=>window.__isolatedToken});
                  const recovered=projectRecoveredCreatorWorkspace({projectId:pid,state});
                  const key='diagnostic-connected-adoption';
                  const readLocalState=()=>JSON.parse(localStorage.getItem(key)||'{"projects":[],"conversations":[],"journey":{}}');
                  const verdict=await commitMovieMentorRecoveryWithLock({projectId:pid,recovered,readLocalState,commit:next=>localStorage.setItem(key,JSON.stringify(next)),locks:navigator.locks});
                  return {verdict,expected:recovered.conversationMessages,stored:readLocalState()};
                },projectId);
                console.log('CONNECTED_ADOPTION_COMMIT_RESULT',JSON.stringify(adoption));
                await restored.reload();
                const resumed=await restored.evaluate(async()=>{
                  const {default:createMemory}=await import('/src/components/studio/mentor/CreatorMemory.js');
                  const {default:createRuntime}=await import('/src/components/studio/mentor/MovieMentorStudioIdentityRuntime.js');
                  const runtime=createRuntime({memory:createMemory({storageKey:'diagnostic-connected-adoption',requireSharedWriteAuthority:true})});
                  return runtime.getResumeSnapshot();
                });
                console.log('CONNECTED_SERVER_ADOPTION_BASELINE',JSON.stringify({adoption,resumed}));
                assert.equal(adoption.verdict.allowed,true);
                assert.ok(resumed.conversationMessages.some(message=>message.text==='A moonlit harbour'),'Recovered server conversation must survive local adoption and fresh runtime');
                console.log('GREEN CONNECTED_SERVER_ADOPTION_RELOAD');
                const continuation=await restored.evaluate(async pid=>{
                  const {default:createMemory}=await import('/src/components/studio/mentor/CreatorMemory.js');
                  const key='diagnostic-connected-adoption';
                  const memory=createMemory({storageKey:key,requireSharedWriteAuthority:true});
                  const before=JSON.parse(localStorage.getItem(key));
                  const args={locks:navigator.locks,projectId:pid,creatorTurnId:'connected-continuation-1',conversation:{creatorMessage:'Add a storm',mentorResponse:'Start with the lighthouse',relatedProjectIds:[pid]},handoff:{content:'Continue the harbour story'}};
                  const first=await memory.settleConversationWithSharedAuthority(args);
                  const bytes=localStorage.getItem(key);
                  const replay=await memory.settleConversationWithSharedAuthority(args);
                  return {first,replay,before,after:JSON.parse(bytes),replayUnchanged:bytes===localStorage.getItem(key)};
                },projectId);
                await restored.reload();
                const extended=await restored.evaluate(async()=>{
                  const {default:createMemory}=await import('/src/components/studio/mentor/CreatorMemory.js');
                  const {default:createRuntime}=await import('/src/components/studio/mentor/MovieMentorStudioIdentityRuntime.js');
                  return createRuntime({memory:createMemory({storageKey:'diagnostic-connected-adoption',requireSharedWriteAuthority:true})}).getResumeSnapshot();
                });
                console.log('CONNECTED_CONTINUATION_RESULT',JSON.stringify({continuation,extended}));
                assert.equal(continuation.before.conversations.length,1);
                assert.equal(continuation.after.conversations.length,2);
                assert.deepEqual(continuation.after.conversations[0],continuation.before.conversations[0]);
                assert.equal(continuation.replayUnchanged,true);
                assert.deepEqual(extended.conversationMessages.map(m=>m.text),['A moonlit harbour','Add a storm','Start with the lighthouse']);
                console.log('GREEN CONNECTED_CONTINUATION_REPLAY_RELOAD');


                await fresh.close();
                return continuation.after;
              }finally{if(child){const done=once(child,'exit');process.kill(-child.pid,'SIGKILL');await done;}fs.rmSync(profile,{recursive:true,force:true});
              }
            }finally{if(browser)await browser.close();await vite.close();}
          }
          export async function runRevisionTwoCourt({port,projectId,ownerToken,expected,expectedHandoff}){
            const root=fileURLToPath(new URL('.',import.meta.url));
            const vite=await createServer({root,server:{host:'127.0.0.1',port:4188,strictPort:true,proxy:{'/api/movie-mentor':{target:'http://127.0.0.1:'+port}}}});
            let browser;
            try{
              await vite.listen();browser=await chromium.launch({headless:true});
              const context=await browser.newContext();
              await context.addInitScript(t=>{window.__isolatedToken=t;window.__initialStorageLength=localStorage.length;},ownerToken);
              const page=await context.newPage();
              await page.goto('http://127.0.0.1:4188/diagnostic-recovery.html');
              assert.equal(await page.evaluate(()=>window.__initialStorageLength),0);
              const recovered=await page.evaluate(async pid=>{
                const {recoverMovieMentorCreatorState}=await import('/src/components/studio/mentor/MovieMentorDurableStateSync.js');
                const {projectRecoveredCreatorWorkspace}=await import('/src/components/studio/mentor/MovieMentorRecoveredWorkspaceProjection.js');
                const {commitMovieMentorRecoveryWithLock}=await import('/src/components/studio/mentor/MovieMentorRecoveryLockedCommit.js');
                const state=await recoverMovieMentorCreatorState({projectId:pid,getAuthToken:async()=>window.__isolatedToken});
                const view=projectRecoveredCreatorWorkspace({projectId:pid,state});
                const key='diagnostic-revision-two';
                const readLocalState=()=>JSON.parse(localStorage.getItem(key)||'{"projects":[],"conversations":[],"journey":{}}');
                const verdict=await commitMovieMentorRecoveryWithLock({projectId:pid,recovered:view,readLocalState,commit:next=>localStorage.setItem(key,JSON.stringify(next)),locks:navigator.locks});
                return {revision:state.revision,generation:state.creatorStateGeneration,records:state.memoryContext.conversations,verdict,stored:readLocalState()};
              },projectId);
              console.log('REVISION_TWO_RECOVERY_RESULT',JSON.stringify(recovered));
              assert.equal(recovered.revision,2);assert.equal(recovered.generation,2);
              assert.deepEqual(recovered.records,expected);assert.equal(recovered.verdict.allowed,true);
              assert.deepEqual(recovered.stored.conversations,expected);
              await page.reload();
              const resumed=await page.evaluate(async()=>{
